name: Update Signal and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "45 8 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Refresh AI sources
        run: node scripts/update-news.mjs
      - name: Refresh Zhihu hot list
        run: node scripts/update-zhihu.mjs
      - name: Apply reviewed Chinese translations
        run: node scripts/apply-translations.mjs
      - name: Validate site data
        run: node scripts/validate.mjs
      - name: Save scheduled snapshot
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/news.json site/translations.json site/zhihu.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily Signal sources"
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
